<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplikasi Catatan Keuangan Sederhana untuk Orang Tua">
    <title>Buku Kas Harian</title>

    <!-- Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-gradient-to-br from-blue-50 via-white to-green-50 min-h-screen">

    <!-- PIN Login Screen -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-md p-8 rounded-3xl shadow-2xl">
            <div class="text-center mb-8">
                <div
                    class="w-20 h-20 bg-gradient-to-br from-blue-500 to-green-500 rounded-full mx-auto mb-4 flex items-center justify-center shadow-lg">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                        </path>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-gray-800 mb-2">Buku Kas Harian</h1>
                <p class="text-gray-600 text-lg">Masukkan PIN untuk melanjutkan</p>
            </div>

            <div class="mb-6">
                <input type="password" id="pinInput" maxlength="4" placeholder="Masukkan PIN 4 digit"
                    class="w-full px-6 py-4 text-2xl text-center border-2 border-gray-300 rounded-2xl focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition-all"
                    inputmode="numeric" pattern="[0-9]*">
                <p class="text-sm text-gray-500 mt-3 text-center">PIN default: 1234</p>
            </div>

            <button onclick="checkPin()"
                class="btn-primary w-full py-4 text-xl font-semibold rounded-2xl shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all">
                Masuk
            </button>

            <div id="pinError" class="hidden mt-4 p-4 bg-red-100 border-l-4 border-red-500 text-red-700 rounded-lg">
                <p class="font-semibold">PIN salah! Silakan coba lagi.</p>
            </div>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="appScreen" class="hidden">
        <!-- Header -->
        <header class="bg-gradient-to-r from-blue-600 to-green-600 text-white p-6 shadow-lg sticky top-0 z-10">
            <div class="max-w-4xl mx-auto">
                <div class="flex justify-between items-center mb-4">
                    <h1 class="text-2xl font-bold">Buku Kas Harian</h1>
                    <button onclick="logout()"
                        class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-xl transition-all">
                        Keluar
                    </button>
                </div>

                <!-- Total Balance Card -->
                <div class="glass-card-white p-6 rounded-2xl shadow-xl">
                    <p class="text-blue-600 text-sm font-semibold mb-1">Total Pengeluaran</p>
                    <p id="totalPengeluaran" class="text-4xl font-bold text-gray-800">Rp 0</p>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-4xl mx-auto p-4 pb-24">

            <!-- Tab Navigation -->
            <div class="flex gap-2 mb-6 bg-white p-2 rounded-2xl shadow-md">
                <button id="tabInput" onclick="switchTab('input')"
                    class="tab-btn active flex-1 py-3 px-4 rounded-xl font-semibold transition-all">
                    ➕ Input Baru
                </button>
                <button id="tabRekap" onclick="switchTab('rekap')"
                    class="tab-btn flex-1 py-3 px-4 rounded-xl font-semibold transition-all">
                    📋 Rekap
                </button>
            </div>

            <!-- Input Form Section -->
            <div id="inputSection" class="space-y-4">
                <div class="glass-card p-6 rounded-2xl shadow-lg">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6">Tambah Pengeluaran</h2>

                    <form id="pengeluaranForm" class="space-y-5">
                        <div>
                            <label class="block text-gray-700 font-semibold mb-2 text-lg">Tanggal</label>
                            <input type="date" id="tanggal" required
                                class="w-full px-4 py-4 text-lg border-2 border-gray-300 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition-all">
                        </div>

                        <div>
                            <label class="block text-gray-700 font-semibold mb-2 text-lg">Keterangan</label>
                            <input type="text" id="namaItem" placeholder="Contoh: Beli Beras" required
                                class="w-full px-4 py-4 text-lg border-2 border-gray-300 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition-all">
                        </div>

                        <div>
                            <label class="block text-gray-700 font-semibold mb-2 text-lg">Jumlah (Rp)</label>
                            <input type="text" id="harga" placeholder="0" required inputmode="numeric"
                                class="w-full px-4 py-4 text-2xl font-bold border-2 border-gray-300 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition-all">
                        </div>

                        <button type="submit"
                            class="btn-primary w-full py-5 text-xl font-bold rounded-xl shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all">
                            💾 Simpan
                        </button>
                    </form>
                </div>
            </div>

            <!-- Rekap Section -->
            <div id="rekapSection" class="hidden space-y-4">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold text-gray-800">Riwayat Transaksi</h2>
                    <button onclick="loadPengeluaran()"
                        class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-xl transition-all">
                        🔄 Refresh
                    </button>
                </div>

                <div id="pengeluaranList" class="space-y-3">
                    <!-- Data will be loaded here -->
                </div>

                <div id="emptyState" class="hidden glass-card p-12 rounded-2xl text-center">
                    <div class="text-6xl mb-4">📝</div>
                    <p class="text-xl text-gray-600">Belum ada data pengeluaran</p>
                    <p class="text-gray-500 mt-2">Mulai tambahkan pengeluaran Anda</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-2xl shadow-2xl">
            <div class="animate-spin w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full mx-auto mb-4">
            </div>
            <p class="text-xl font-semibold text-gray-800">Memproses...</p>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>

</html>
