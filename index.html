<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Buku Kas</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%23d97706'/><text x='50' y='67' text-anchor='middle' font-size='52' font-family='Georgia,serif' fill='%23fff'>₭</text></svg>" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Lora','Georgia','serif'],
            sans:  ['Nunito','system-ui','sans-serif'],
          },
          colors: {
            /* backgrounds — warm cream, NOT white */
            canvas:  '#f5f0e6',
            paper:   '#ede6d8',
            card:    '#fdf8f0',
            rim:     '#c8bfaf',  /* darker border for clarity */

            /* text — rich brown, NOT black/gray */
            ink:     '#2c2016',  /* very dark warm brown */
            inksoft: '#5a4a38',  /* medium warm brown */

            /* accent — rich amber, warm & visible */
            amber:   '#d97706',
            amberbg: '#fef3c7',
            amberrim:'#f59e0b',

            /* status */
            ok:      '#15803d',
            okbg:    '#dcfce7',
            err:     '#b91c1c',
            errbg:   '#fee2e2',
          },
          fontSize: {
            /* everything bumped up */
            'xs':   ['14px', '1.5'],
            'sm':   ['16px', '1.6'],
            'base': ['18px', '1.7'],
            'lg':   ['20px', '1.6'],
            'xl':   ['22px', '1.5'],
            '2xl':  ['26px', '1.4'],
            '3xl':  ['32px', '1.3'],
            '4xl':  ['40px', '1.2'],
          },
          borderRadius: {
            '2xl': '1rem',
            '3xl': '1.5rem',
            '4xl': '2rem',
          },
          animation: {
            'slideup':  'slideup 0.3s cubic-bezier(0.22,1,0.36,1) both',
            'fadein':   'fadein 0.25s ease both',
            'shake':    'shake 0.4s ease both',
            'toastin':  'toastin 0.3s cubic-bezier(0.22,1,0.36,1) both',
            'toastout': 'toastout 0.25s ease both',
            'spin-slow':'spin 0.9s linear infinite',
          },
          keyframes: {
            slideup:  { from:{opacity:'0',transform:'translateY(10px)'}, to:{opacity:'1',transform:'translateY(0)'} },
            fadein:   { from:{opacity:'0'}, to:{opacity:'1'} },
            shake:    { '0%,100%':{transform:'translateX(0)'},'20%,60%':{transform:'translateX(-6px)'},'40%,80%':{transform:'translateX(6px)'} },
            toastin:  { from:{opacity:'0',transform:'translateY(-12px) scale(0.95)'}, to:{opacity:'1',transform:'translateY(0) scale(1)'} },
            toastout: { to:{opacity:'0',transform:'translateY(-8px) scale(0.96)'} },
          },
        }
      }
    }
  </script>

  <style>
    *, *::before, *::after { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Nunito', system-ui, sans-serif;
      font-weight: 700;               /* bold by default */
      background: #f5f0e6;
      color: #2c2016;
      max-width: 430px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
    }
    input[type="date"] { color-scheme: light; }
    ::-webkit-scrollbar { display: none; }
    .scrollable { overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .no-sel { -webkit-user-select: none; user-select: none; }

    /* PIN dot transitions */
    .pin-dot { transition: background .15s ease, border-color .15s ease, transform .18s cubic-bezier(0.34,1.56,0.64,1); }
    .pin-dot.filled { background: #d97706; border-color: #d97706; transform: scale(1.3); }
    .pin-dot.wrong  { background: #b91c1c; border-color: #b91c1c; animation: shake .4s ease both; }

    /* Tab bar */
    .tab-item { border-bottom: 3px solid transparent; color: #a89885; transition: all .2s; }
    .tab-item.active { color: #2c2016; border-bottom-color: #d97706; }

    /* Chip filter */
    .chip { transition: all .15s; }
    .chip.active { background: #d97706; border-color: #d97706; color: #fff; }

    /* Field focus */
    .field:focus {
      outline: none;
      border-color: #d97706;
      box-shadow: 0 0 0 4px rgba(217,119,6,0.15);
    }

    @keyframes shake {
      0%,100%{transform:translateX(0)}
      20%,60%{transform:translateX(-6px)}
      40%,80%{transform:translateX(6px)}
    }
  </style>
</head>

<body class="flex flex-col h-full">

  <!-- ═══════════ LOGIN ═══════════ -->
  <div id="loginScreen" class="fixed inset-0 flex flex-col items-center justify-center px-5 overflow-hidden z-50 bg-canvas">

    <!-- soft warm blobs -->
    <div class="absolute -top-16 -right-12 w-64 h-64 rounded-full opacity-30 blur-3xl pointer-events-none" style="background:#fcd34d"></div>
    <div class="absolute -bottom-10 -left-10 w-56 h-56 rounded-full opacity-20 blur-3xl pointer-events-none" style="background:#fed7aa"></div>

    <div class="relative z-10 w-full max-w-[360px] flex flex-col gap-8">

      <!-- Brand -->
      <div class="text-center animate-slideup">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-3xl mb-4"
          style="background:#d97706; box-shadow:0 6px 24px rgba(217,119,6,0.30)">
          <span class="font-serif text-white text-3xl">₭</span>
        </div>
        <h1 class="font-serif text-3xl text-ink leading-tight">Buku Kas</h1>
        <p class="text-base mt-2 text-inksoft">Masukkan PIN untuk masuk</p>
      </div>

      <!-- PIN card -->
      <div class="bg-card border-2 border-rim rounded-4xl p-6 flex flex-col items-center gap-6 animate-slideup"
        style="animation-delay:.07s; box-shadow:0 4px 24px rgba(100,80,50,0.10)">

        <!-- Dots -->
        <div class="flex gap-5 items-center" style="min-height:28px">
          <span class="pin-dot w-5 h-5 rounded-full border-[3px] border-rim block"></span>
          <span class="pin-dot w-5 h-5 rounded-full border-[3px] border-rim block"></span>
          <span class="pin-dot w-5 h-5 rounded-full border-[3px] border-rim block"></span>
          <span class="pin-dot w-5 h-5 rounded-full border-[3px] border-rim block"></span>
        </div>

        <p id="pinError" class="hidden text-sm font-bold animate-fadein px-4 py-2 rounded-xl"
          style="color:#b91c1c; background:#fee2e2">
          PIN salah. Coba lagi.
        </p>

        <!-- Numpad — large keys -->
        <div class="grid grid-cols-3 gap-3 w-full">
          <!-- row 1 -->
          <button onclick="addDigit('1')" class="numkey h-[68px] bg-paper border-2 border-rim rounded-2xl font-serif text-2xl text-ink active:scale-95 no-sel" style="transition:transform .1s, background .1s; box-shadow:0 2px 0 #c8bfaf">1</button>
          <button onclick="addDigit('2')" class="numkey h-[68px] bg-paper border-2 border-rim rounded-2xl font-serif text-2xl text-ink active:scale-95 no-sel" style="transition:transform .1s, background .1s; box-shadow:0 2px 0 #c8bfaf">2</button>
          <button onclick="addDigit('3')" class="numkey h-[68px] bg-paper border-2 border-rim rounded-2xl font-serif text-2xl text-ink active:scale-95 no-sel" style="transition:transform .1s, background .1s; box-shadow:0 2px 0 #c8bfaf">3</button>
          <!-- row 2 -->
          <button onclick="addDigit('4')" class="numkey h-[68px] bg-paper border-2 border-rim rounded-2xl font-serif text-2xl text-ink active:scale-95 no-sel" style="transition:transform .1s, background .1s; box-shadow:0 2px 0 #c8bfaf">4</button>
          <button onclick="addDigit('5')" class="numkey h-[68px] bg-paper border-2 border-rim rounded-2xl font-serif text-2xl text-ink active:scale-95 no-sel" style="transition:transform .1s, background .1s; box-shadow:0 2px 0 #c8bfaf">5</button>
          <button onclick="addDigit('6')" class="numkey h-[68px] bg-paper border-2 border-rim rounded-2xl font-serif text-2xl text-ink active:scale-95 no-sel" style="transition:transform .1s, background .1s; box-shadow:0 2px 0 #c8bfaf">6</button>
          <!-- row 3 -->
          <button onclick="addDigit('7')" class="numkey h-[68px] bg-paper border-2 border-rim rounded-2xl font-serif text-2xl text-ink active:scale-95 no-sel" style="transition:transform .1s, background .1s; box-shadow:0 2px 0 #c8bfaf">7</button>
          <button onclick="addDigit('8')" class="numkey h-[68px] bg-paper border-2 border-rim rounded-2xl font-serif text-2xl text-ink active:scale-95 no-sel" style="transition:transform .1s, background .1s; box-shadow:0 2px 0 #c8bfaf">8</button>
          <button onclick="addDigit('9')" class="numkey h-[68px] bg-paper border-2 border-rim rounded-2xl font-serif text-2xl text-ink active:scale-95 no-sel" style="transition:transform .1s, background .1s; box-shadow:0 2px 0 #c8bfaf">9</button>
          <!-- row 4 -->
          <div class="h-[68px]"></div>
          <button onclick="addDigit('0')" class="numkey h-[68px] bg-paper border-2 border-rim rounded-2xl font-serif text-2xl text-ink active:scale-95 no-sel" style="transition:transform .1s, background .1s; box-shadow:0 2px 0 #c8bfaf">0</button>
          <button onclick="delDigit()" class="h-[68px] bg-paper border-2 border-rim rounded-2xl flex items-center justify-center active:scale-95 no-sel" style="color:#5a4a38; transition:transform .1s; box-shadow:0 2px 0 #c8bfaf">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
              <line x1="18" y1="9" x2="13" y2="14"/><line x1="13" y1="9" x2="18" y2="14"/>
            </svg>
          </button>
        </div>

      </div>
    </div>
  </div>


  <!-- ═══════════ APP ═══════════ -->
  <div id="appScreen" class="hidden flex flex-col h-full">

    <!-- HEADER -->
    <header class="bg-card border-b-2 border-rim shrink-0 px-5 pt-4 pb-4 relative overflow-hidden">
      <div class="absolute -top-6 -right-6 w-32 h-32 rounded-full opacity-25 blur-2xl pointer-events-none" style="background:#fcd34d"></div>

      <!-- top bar -->
      <div class="flex items-center justify-between mb-4 relative">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0" style="background:#d97706">
            <span class="font-serif text-white text-lg">₭</span>
          </div>
          <span class="text-lg font-bold text-inksoft">Buku Kas</span>
        </div>
        <button onclick="logout()"
          class="flex items-center gap-2 text-base font-bold bg-paper border-2 border-rim rounded-xl px-4 py-2.5 active:scale-95 no-sel text-inksoft"
          style="min-height:44px; transition:all .15s">
          <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Keluar
        </button>
      </div>

      <!-- Summary card -->
      <div class="rounded-3xl px-5 py-4 relative overflow-hidden border-2" style="background:#fef3c7; border-color:#f59e0b">
        <div class="absolute right-4 bottom-2 opacity-[0.06] font-serif text-ink text-[64px] leading-none pointer-events-none select-none">₭</div>
        <p class="text-sm font-bold tracking-wide uppercase mb-1" style="color:#92400e">Keluar Hari Ini</p>
        <p id="totalPengeluaran" class="font-serif text-4xl font-bold leading-tight text-ink">Rp 0</p>
        <p id="todayDate" class="text-sm mt-1 font-semibold text-inksoft">—</p>
      </div>
    </header>

    <!-- TAB BAR -->
    <div class="flex bg-card border-b-2 border-rim shrink-0">
      <button id="tabInput" onclick="switchTab('input')"
        class="tab-item active flex-1 flex items-center justify-center gap-2.5 font-bold text-lg no-sel"
        style="height:58px">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
        Catat
      </button>
      <button id="tabRekap" onclick="switchTab('rekap')"
        class="tab-item flex-1 flex items-center justify-center gap-2.5 font-bold text-lg no-sel"
        style="height:58px">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        Rekap
      </button>
    </div>

    <!-- CONTENT -->
    <main class="scrollable flex-1 px-4 py-5 space-y-4 bg-canvas">

      <!-- ── CATAT / INPUT ── -->
      <div id="inputSection">
        <div class="bg-card border-2 border-rim rounded-3xl p-5 animate-slideup"
          style="box-shadow:0 2px 16px rgba(100,80,50,0.08)">

          <h2 class="font-serif text-2xl text-ink mb-5">Tambah Pengeluaran</h2>

          <form id="pengeluaranForm" class="space-y-5" onsubmit="handleSubmit(event)">

            <!-- Tanggal -->
            <div class="space-y-2">
              <label class="flex items-center gap-2 text-base font-bold text-inksoft" for="tanggal">
                <svg width="18" height="18" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                Tanggal
              </label>
              <input type="date" id="tanggal" required
                class="field w-full bg-paper border-2 border-rim rounded-2xl px-4 text-ink text-lg font-bold font-sans outline-none"
                style="height:56px; transition:all .15s" />
            </div>

            <!-- Keterangan -->
            <div class="space-y-2">
              <label class="flex items-center gap-2 text-base font-bold text-inksoft" for="namaItem">
                <svg width="18" height="18" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/>
                </svg>
                Keterangan
              </label>
              <input type="text" id="namaItem" placeholder="Contoh: Beli beras 5kg" required
                class="field w-full bg-paper border-2 border-rim rounded-2xl px-4 text-ink text-lg font-bold font-sans placeholder-rim outline-none"
                style="height:56px; transition:all .15s" />
            </div>

            <!-- Jumlah -->
            <div class="space-y-2">
              <label class="flex items-center gap-2 text-base font-bold text-inksoft" for="harga">
                <svg width="18" height="18" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                  <line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
                Jumlah (Rp)
              </label>
              <div id="amountWrap" class="flex items-center bg-paper border-2 border-rim rounded-2xl overflow-hidden" style="height:56px; transition:all .15s">
                <span class="pl-4 pr-2 text-lg font-bold shrink-0" style="color:#d97706">Rp</span>
                <input type="text" id="harga" placeholder="0" required inputmode="numeric"
                  class="flex-1 bg-transparent pr-4 text-ink text-lg font-bold font-sans placeholder-rim outline-none h-full" />
              </div>
            </div>

            <!-- Submit button — very large and clear -->
            <button type="submit"
              class="w-full font-bold text-xl rounded-2xl flex items-center justify-center gap-3 active:scale-[0.97] no-sel text-white"
              style="height:60px; background:#d97706; box-shadow:0 4px 0 #b45309, 0 6px 20px rgba(217,119,6,0.25); transition:transform .1s">
              <svg width="22" height="22" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
              Simpan
            </button>

          </form>
        </div>
      </div>

      <!-- ── REKAP ── -->
      <div id="rekapSection" class="hidden space-y-4">

        <!-- Filter chips — larger & clear -->
        <div class="flex gap-2 overflow-x-auto pb-1 no-sel">
          <button id="filterToday" onclick="filterByPeriod('today')"
            class="chip shrink-0 px-5 py-3 rounded-2xl text-base font-bold border-2 border-rim bg-card text-inksoft active:scale-95 no-sel"
            style="min-height:48px">Hari Ini</button>
          <button id="filterWeek" onclick="filterByPeriod('week')"
            class="chip shrink-0 px-5 py-3 rounded-2xl text-base font-bold border-2 border-rim bg-card text-inksoft active:scale-95 no-sel"
            style="min-height:48px">Minggu Ini</button>
          <button id="filterMonth" onclick="filterByPeriod('month')"
            class="chip shrink-0 px-5 py-3 rounded-2xl text-base font-bold border-2 border-rim bg-card text-inksoft active:scale-95 no-sel"
            style="min-height:48px">Bulan Ini</button>
          <button id="filterAll" onclick="filterByPeriod('all')"
            class="chip shrink-0 px-5 py-3 rounded-2xl text-base font-bold border-2 border-rim bg-card text-inksoft active:scale-95 no-sel"
            style="min-height:48px">Semua</button>
        </div>

        <!-- Summary bar -->
        <div class="bg-card border-2 border-rim rounded-2xl px-5 py-4 flex items-center gap-4"
          style="box-shadow:0 2px 8px rgba(100,80,50,0.07)">
          <div class="flex-1 min-w-0">
            <p class="text-xs font-bold uppercase tracking-widest mb-1" style="color:#92400e">Total <span id="periodLabel">Hari Ini</span></p>
            <p id="filteredTotal" class="font-serif text-2xl font-bold text-ink leading-tight">Rp 0</p>
          </div>
          <div class="w-[2px] h-10 bg-rim shrink-0"></div>
          <div class="text-center shrink-0 px-2">
            <p class="text-xs font-bold uppercase tracking-widest mb-1" style="color:#92400e">Jumlah</p>
            <p id="transactionCount" class="font-serif text-2xl font-bold text-ink leading-tight">0</p>
          </div>
          <!-- Refresh button -->
          <button onclick="loadPengeluaran()"
            class="ml-auto w-11 h-11 bg-paper border-2 border-rim rounded-xl flex items-center justify-center active:scale-95 no-sel text-inksoft"
            style="transition:all .15s; min-width:44px">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
          </button>
        </div>

        <!-- Transaction list -->
        <div id="pengeluaranList"></div>

        <!-- Empty state -->
        <div id="emptyState" class="hidden flex flex-col items-center justify-center py-14 gap-4 text-center">
          <div class="w-20 h-20 rounded-3xl border-2 border-rim bg-card flex items-center justify-center text-4xl mb-2">📋</div>
          <p class="text-xl font-bold text-inksoft">Belum ada catatan</p>
          <p class="text-base text-inksoft opacity-70">Tekan tab "Catat" untuk mulai</p>
        </div>

      </div>
    </main>
  </div>

  <!-- LOADING -->
  <div id="loadingOverlay" class="hidden fixed inset-0 flex items-center justify-center z-[200]"
    style="background:rgba(245,240,230,0.85); backdrop-filter:blur(4px)">
    <div class="flex flex-col items-center gap-4">
      <div class="w-12 h-12 rounded-full border-[3px] animate-spin-slow" style="border-color:#c8bfaf; border-top-color:#d97706"></div>
      <p class="text-base font-bold text-inksoft">Memproses…</p>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toastContainer"
    class="fixed top-4 left-1/2 -translate-x-1/2 z-[300] flex flex-col gap-2 pointer-events-none w-[calc(100%-2rem)] max-w-[400px]">
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
